[package]
name = "prom-metrics"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Kubernetes Resource Metrics API (metrics.k8s.io) served from Prometheus"
license = "Apache-2.0"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "form"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "net", "time", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
