apiVersion: apps/v1
kind: Deployment
metadata:
  name: prom-metrics
  namespace: kube-system
  labels:
    app: prom-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prom-metrics
  template:
    metadata:
      labels:
        app: prom-metrics
    spec:
      # The adapter never talks to the Kubernetes API, so it needs no token
      # and no RBAC.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prom-metrics
          image: ghcr.io/justiniven/prom-metrics:0.1.0
          args: []
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.monitoring.svc:9090
            - name: POLL_INTERVAL
              value: 15s
            - name: MAX_METRICS_AGE
              value: 60s
            - name: CPU_RATE_WINDOW
              value: 60s
            - name: LISTEN_ADDR
              value: 0.0.0.0:8443
            - name: RUST_LOG
              value: info
          ports:
            - name: https
              containerPort: 8443
          livenessProbe:
            httpGet:
              path: /livez
              port: https
              scheme: HTTPS
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: serving-cert
              mountPath: /var/run/serving-cert
              readOnly: true
      volumes:
        - name: serving-cert
          secret:
            secretName: prom-metrics-serving-cert
