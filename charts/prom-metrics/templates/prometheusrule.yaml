{{- if .Values.prometheusRule.enabled }}
{{- $sel := printf "namespace=%q" (include "prom-metrics.namespace" .) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "prom-metrics.fullname" . }}
  namespace: {{ include "prom-metrics.namespace" . }}
  labels:
    {{- include "prom-metrics.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: prom-metrics
      rules:
        - alert: PromMetricsStale
          expr: time() - max(metrics_adapter_last_successful_refresh_timestamp_seconds{ {{- $sel -}} }) > {{ .Values.prometheusRule.staleAfterSeconds }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: metrics.k8s.io data is stale; HPAs are not receiving metrics.
        - alert: PromMetricsQueryErrors
          expr: sum(rate(metrics_adapter_prometheus_query_errors_total{ {{- $sel -}} }[10m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: prom-metrics cannot query Prometheus.
        - alert: PromMetricsEmptySnapshot
          expr: max(metrics_adapter_cached_pods{ {{- $sel -}} }) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: prom-metrics snapshot has no pods; check cAdvisor labels in Prometheus.
        - alert: PromMetricsSlowRefresh
          expr: max(metrics_adapter_prometheus_query_duration_seconds{ {{- $sel -}} }) > {{ .Values.prometheusRule.slowRefreshSeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Prometheus refresh is approaching the poll timeout.
        - alert: MetricsAPIServiceUnavailable
          expr: max by (name) (aggregator_unavailable_apiservice{name=~"v1(beta1)?.metrics.k8s.io"}) == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The metrics.k8s.io APIService is unavailable to the API server.
        {{- with .Values.prometheusRule.extraRules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
