{{- if not (has .Values.tls.type (list "helm" "cert-manager" "existingSecret")) }}
{{- fail (printf "tls.type must be helm, cert-manager or existingSecret, got %q" .Values.tls.type) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prom-metrics.fullname" . }}
  namespace: {{ include "prom-metrics.namespace" . }}
  labels:
    {{- include "prom-metrics.labels" . | nindent 4 }}
  {{- with .Values.deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicas }}
  {{- with .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "prom-metrics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "prom-metrics.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if eq .Values.tls.type "helm" }}
        # The adapter does not reload certificates; roll pods when the Secret changes.
        checksum/tls: {{ include "prom-metrics.helmTLS" . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Every metric comes from Prometheus; no Kubernetes API access is needed.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: prom-metrics
          image: {{ include "prom-metrics.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.pollInterval | quote }}
            - name: MAX_METRICS_AGE
              value: {{ .Values.maxMetricsAge | quote }}
            - name: CPU_RATE_WINDOW
              value: {{ .Values.cpuRateWindow | quote }}
            - name: LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.containerPort) | quote }}
            # Set explicitly so a missing certificate fails startup instead of falling back to HTTP.
            - name: TLS_CERT_FILE
              value: /var/run/serving-cert/tls.crt
            - name: TLS_KEY_FILE
              value: /var/run/serving-cert/tls.key
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: https
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: serving-cert
              mountPath: /var/run/serving-cert
              readOnly: true
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: serving-cert
          secret:
            secretName: {{ include "prom-metrics.tlsSecretName" . }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      {{- $constraints := list }}
      {{- range .Values.topologySpreadConstraints }}
      {{- $c := deepCopy . }}
      {{- if not $c.labelSelector }}
      {{- $_ := set $c "labelSelector" (dict "matchLabels" (include "prom-metrics.selectorLabels" $ | fromYaml)) }}
      {{- end }}
      {{- $constraints = append $constraints $c }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $constraints | nindent 8 }}
      {{- end }}
