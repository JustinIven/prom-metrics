name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  check-version:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches Cargo.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -nE 's/^version = "(.*)"/\1/p' Cargo.toml | head -n1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag v$tag_version does not match Cargo.toml version $cargo_version"
            exit 1
          fi
          for field in version appVersion; do
            chart_value="$(sed -nE "s/^$field: \"?([^\"]*)\"?/\1/p" charts/prom-metrics/Chart.yaml)"
            if [ "$tag_version" != "$chart_value" ]; then
              echo "::error::tag v$tag_version does not match Chart.yaml $field $chart_value"
              exit 1
            fi
          done

  build-and-push:
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: build-and-push
    uses: ./.github/workflows/chart.yml
    with:
      publish: true
    permissions:
      contents: read
      packages: write

  release:
    needs: chart
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.content }}
